<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Preetam Roy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e14'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%236ee7f9' text-anchor='middle'%3EPR%3C/text%3E%3C/svg%3E">
<!--
  This page is deliberately self-contained: no external stylesheet, no web
  font, no script. An error page is served at whatever URL the visitor got
  wrong, so a relative asset path would resolve against that path and 404 in
  turn — leaving the error page itself broken. Everything it needs is inline.
-->
<style>
  :root {
    --bg: #0a0e14; --text: #e8ecf4; --muted: #8d99b0;
    --accent: #6ee7f9; --accent-2: #a78bfa; --accent-ink: #05252c;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f7f8fb; --text: #1d2534; --muted: #57627a;
      --accent: #0e7f96; --accent-2: #6d4ae0; --accent-ink: #ffffff;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-content: center; justify-items: center;
    gap: 1.1rem; padding: 2rem 1.25rem; text-align: center;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .code {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(4rem, 22vw, 9rem); font-weight: 700;
    letter-spacing: -.05em; line-height: 1;
    background: linear-gradient(105deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { margin: 0; max-width: 42ch; color: var(--muted); }
  a {
    display: inline-flex; align-items: center; min-height: 44px;
    margin-top: .6rem; padding: .8rem 1.5rem;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--accent-ink); text-decoration: none;
    font-weight: 600; border-radius: 999px;
  }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <p class="code">404</p>
  <p>That page doesn't exist. The portfolio is a single page — everything is on it.</p>
  <a href="/">Back to the portfolio</a>
</body>
</html>
