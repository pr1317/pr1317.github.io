# Render Blueprint. Two ways to run this site are described here; the static
# one is active because it is free and this site has no server-side code.
services:
  - type: web
    name: preetam-roy-portfolio
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /demos/*/frames/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # To run the Caddy container on Render instead, delete the block above and
  # uncomment this one. It uses the same Dockerfile Railway builds.
  #
  # - type: web
  #   name: preetam-roy-portfolio
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   plan: free
  #   healthCheckPath: /
